<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Pro | Cloud Sync</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <!-- SDK do Firebase (Versão Compatibilidade para funcionar em arquivo único) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --sidebar-bg: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --success-color: #00ff88;
            --danger-color: #ff4b2b;
            --text-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--primary-gradient); background-attachment: fixed; min-height: 100vh; color: var(--text-color); display: flex; overflow-x: hidden; }

        /* --- MENU LATERAL --- */
        .sidebar { width: 260px; background: var(--sidebar-bg); backdrop-filter: blur(20px); border-right: 1px solid var(--glass-border); height: 100vh; display: flex; flex-direction: column; padding: 30px 20px; transition: all 0.3s ease; z-index: 1000; }
        .sidebar h2 { text-align: center; margin-bottom: 40px; font-size: 1.5rem; letter-spacing: 2px; }
        .nav-menu { list-style: none; flex-grow: 1; }
        .nav-item { margin-bottom: 15px; }
        .nav-link { display: flex; align-items: center; gap: 15px; padding: 12px 20px; color: white; text-decoration: none; border-radius: 12px; transition: all 0.3s ease; cursor: pointer; opacity: 0.8; }
        .nav-link:hover, .nav-link.active { background: rgba(255, 255, 255, 0.2); opacity: 1; transform: translateX(10px); }
        .nav-link.active { background: white; color: #764ba2; font-weight: 600; }

        /* --- CONTEÚDO --- */
        .main-content { flex-grow: 1; padding: 40px; height: 100vh; overflow-y: auto; transition: all 0.3s ease; }
        .page-section { display: none; animation: fadeIn 0.5s ease; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card { background: var(--glass-bg); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 25px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2); margin-bottom: 20px; }
        h1 { margin-bottom: 30px; font-weight: 700; }
        .balance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .main-balance { text-align: center; }
        .main-balance p { font-size: 2.5rem; font-weight: 700; }
        .income-text { color: var(--success-color); }
        .expense-text { color: var(--danger-color); }

        .form-group { position: relative; margin-bottom: 20px; }
        .form-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); opacity: 0.7; }
        input { width: 100%; padding: 15px 15px 15px 45px; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); border-radius: 12px; color: white; outline: none; font-size: 1rem; }
        .btn-primary { width: 100%; padding: 15px; border: none; border-radius: 12px; background: white; color: #764ba2; font-weight: 700; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary:hover { transform: scale(1.02); background: #f0f0f0; }

        .report-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; overflow: hidden; }
        .report-table th, .report-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--glass-border); }
        .report-table th { background: rgba(255,255,255,0.1); }

        .menu-toggle { display: none; position: fixed; top: 20px; right: 20px; background: white; color: #764ba2; border: none; width: 45px; height: 45px; border-radius: 10px; z-index: 2000; cursor: pointer; }

        @media (max-width: 850px) {
            .sidebar { position: fixed; left: -260px; }
            .sidebar.open { left: 0; }
            .menu-toggle { display: block; }
            .main-content { padding: 20px; padding-top: 80px; }
        }
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <aside class="sidebar" id="sidebar">
        <h2>💎 Finanças Pro</h2>
        <ul class="nav-menu">
            <li class="nav-item">
                <div class="nav-link active" onclick="showSection('dashboard', this)">
                    <i class="fas fa-chart-pie"></i> Dashboard
                </div>
            </li>
            <li class="nav-item">
                <div class="nav-link" onclick="showSection('cadastro', this)">
                    <i class="fas fa-plus-circle"></i> Cadastro
                </div>
            </li>
            <li class="nav-item">
                <div class="nav-link" onclick="showSection('relatorio', this)">
                    <i class="fas fa-file-pdf"></i> Relatório
                </div>
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <section id="dashboard" class="page-section active">
            <h1>Resumo Financeiro</h1>
            <div class="balance-grid">
                <div class="glass-card main-balance">
                    <h3>Saldo Total</h3>
                    <p id="balance">R$ 0,00</p>
                </div>
                <div class="glass-card">
                    <h3>Receitas</h3>
                    <p id="money-plus" class="income-text">R$ 0,00</p>
                </div>
                <div class="glass-card">
                    <h3>Despesas</h3>
                    <p id="money-minus" class="expense-text">R$ 0,00</p>
                </div>
            </div>
            <div class="glass-card">
                <h3>Últimas Transações</h3>
                <ul id="recent-transactions" style="list-style: none; margin-top: 20px;"></ul>
            </div>
        </section>

        <section id="cadastro" class="page-section">
            <h1>Lançar Transação</h1>
            <div class="glass-card" style="max-width: 600px; margin: 0 auto;">
                <div class="form-group">
                    <i class="fas fa-pen"></i>
                    <input type="text" id="text" placeholder="Descrição (ex: Salário, Aluguel)">
                </div>
                <div class="form-group">
                    <i class="fas fa-money-bill-wave"></i>
                    <input type="number" id="amount" step="0.01" placeholder="Valor (Negativo para gastos)">
                </div>
                <button class="btn-primary" onclick="addTransaction()">
                    <i class="fas fa-save"></i> Salvar na Nuvem
                </button>
            </div>
        </section>

        <section id="relatorio" class="page-section">
            <h1>Relatório Detalhado</h1>
            <div class="glass-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <p>Sincronizado com Nuvem Firebase</p>
                    <button class="btn-primary" style="width: auto;" onclick="exportPDF()">
                        <i class="fas fa-file-download"></i> Baixar PDF
                    </button>
                </div>
                <table class="report-table">
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Valor</th>
                            <th>Tipo</th>
                        </tr>
                    </thead>
                    <tbody id="report-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // ============================================================
        // 1. CONFIGURAÇÃO DO FIREBASE (COLE SEUS DADOS AQUI)
        // ============================================================
        const firebaseConfig = {
            apiKey: "COLE_AQUI_SUA_API_KEY",
            authDomain: "COLE_AQUI_SEU_AUTH_DOMAIN",
            projectId: "COLE_AQUI_SEU_PROJECT_ID",
            storageBucket: "COLE_AQUI_SEU_STORAGE_BUCKET",
            messagingSenderId: "COLE_AQUI_SENDER_ID",
            appId: "COLE_AQUI_APP_ID"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const transactionsCol = db.collection('transactions');

        // ============================================================
        // 2. LÓGICA DE NAVEGAÇÃO
        // ============================================================
        function showSection(sectionId, element) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            element.classList.add('active');
            if(window.innerWidth <= 850) toggleSidebar();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // ============================================================
        // 3. LÓGICA FINANCEIRA COM FIREBASE (Sincronização Real-time)
        // ============================================================
        const balanceEl = document.getElementById('balance');
        const moneyPlusEl = document.getElementById('money-plus');
        const moneyMinusEl = document.getElementById('money-minus');
        const recentListEl = document.getElementById('recent-transactions');
        const reportBodyEl = document.getElementById('report-body');
        const textInput = document.getElementById('text');
        const amountInput = document.getElementById('amount');

        // Adiciona transação no Firebase
        async function addTransaction() {
            if (textInput.value.trim() === '' || amountInput.value.trim() === '') {
                alert('Preencha todos os campos!');
                return;
            }

            try {
                await transactionsCol.add({
                    text: textInput.value,
                    amount: parseFloat(amountInput.value),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                textInput.value = '';
                amountInput.value = '';
                alert('Sincronizado com a nuvem!');
            } catch (e) {
                console.error("Erro ao salvar: ", e);
                alert("Erro ao salvar. Verifique as regras do Firestore.");
            }
        }

        // ESCUTA EM TEMPO REAL: Sempre que mudar no Firebase, atualiza na tela
        transactionsCol.orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            let transactions = [];
            snapshot.forEach(doc => {
                transactions.push({ id: doc.id, ...doc.data() });
            });
            updateUI(transactions);
        });

        function updateUI(transactions) {
            // Atualizar Valores
            const amounts = transactions.map(t => t.amount);
            const total = amounts.reduce((acc, item) => (acc += item), 0).toFixed(2);
            const income = amounts.filter(item => item > 0).reduce((acc, item) => (acc += item), 0).toFixed(2);
            const expense = (amounts.filter(item => item < 0).reduce((acc, item) => (acc += item), 0) * -1).toFixed(2);

            balanceEl.innerText = `R$ ${total}`;
            moneyPlusEl.innerText = `R$ ${income}`;
            moneyMinusEl.innerText = `R$ ${expense}`;

            // Atualizar Listas
            recentListEl.innerHTML = '';
            reportBodyEl.innerHTML = '';

            transactions.forEach(t => {
                // Dashboard
                const item = document.createElement('li');
                item.style.cssText = "display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid var(--glass-border);";
                item.innerHTML = `<span>${t.text}</span> <strong class="${t.amount < 0 ? 'expense-text' : 'income-text'}">R$ ${t.amount.toFixed(2)}</strong>`;
                recentListEl.appendChild(item);

                // Relatório
                const row = document.createElement('tr');
                row.innerHTML = `<td>${t.text}</td><td>R$ ${Math.abs(t.amount).toFixed(2)}</td><td class="${t.amount < 0 ? 'expense-text' : 'income-text'}">${t.amount < 0 ? 'Despesa' : 'Receita'}</td>`;
                reportBodyEl.appendChild(row);
            });
        }

        // Exportar PDF
        async function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Relatório Financeiro Sincronizado", 14, 20);
            
            const data = [];
            // Pega os dados atuais da tela
            document.querySelectorAll('#report-body tr').forEach(tr => {
                const cols = tr.querySelectorAll('td');
                data.push([cols[0].innerText, cols[1].innerText, cols[2].innerText]);
            });

            doc.autoTable({
                startY: 30,
                head: [['Descrição', 'Valor', 'Tipo']],
                body: data,
                theme: 'grid',
                headStyles: { fillColor: [118, 75, 162] }
            });
            doc.save('meu-financeiro-cloud.pdf');
        }
    </script>
</body>
</html>
